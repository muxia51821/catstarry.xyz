name: Sync production publication manifests

on:
  repository_dispatch:
    types:
      - catstarry-production-deployment-succeeded

permissions:
  contents: read

concurrency:
  group: production-publication-sync
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.event.client_payload.environment == 'production' &&
      github.event.client_payload.status == 'success' &&
      github.event.client_payload.sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      DEPLOYMENT_ENVIRONMENT: production
      DEPLOYMENT_STATUS: success
      DEPLOYED_SHA: ${{ github.event.client_payload.sha }}
      SYNC_BLOG: ${{ github.event.client_payload.blog_sync }}
      SYNC_LEARN: ${{ github.event.client_payload.learn_sync }}
      FEED_API_URL: ${{ vars.FEED_API_URL }}
      FOOTPRINT_INGEST_TOKEN: ${{ secrets.FOOTPRINT_INGEST_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify deployed commit
        shell: bash
        run: |
          [[ "$DEPLOYED_SHA" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$DEPLOYED_SHA^{commit}"
          git merge-base --is-ancestor "$DEPLOYED_SHA" origin/main
          git checkout --detach "$DEPLOYED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify publication sync scope
        shell: bash
        run: |
          [[ "$SYNC_BLOG" == "true" || "$SYNC_BLOG" == "false" ]]
          [[ "$SYNC_LEARN" == "true" || "$SYNC_LEARN" == "false" ]]
          [[ "$SYNC_BLOG" == "true" || "$SYNC_LEARN" == "true" ]]
      - name: Sync Blog publications
        id: blog-sync
        if: env.SYNC_BLOG == 'true'
        continue-on-error: true
        run: npm run blog:sync-publications
      - name: Sync Learn publications
        id: learn-sync
        if: env.SYNC_LEARN == 'true'
        continue-on-error: true
        run: npm run learn:sync-publications
      - name: Require requested publication syncs
        if: always()
        shell: bash
        run: |
          [[ "$SYNC_BLOG" != "true" || "${{ steps.blog-sync.outcome }}" == "success" ]]
          [[ "$SYNC_LEARN" != "true" || "${{ steps.learn-sync.outcome }}" == "success" ]]
