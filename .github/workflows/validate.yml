name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run test:contracts
      - run: npm run worker:config
      - run: npm run worker:types:check
      - run: npm run worker:typecheck
      - run: npm run site:typecheck
      - run: npm run build
      - run: npm run test:site-output
      - run: node scripts/learn-production-transition-contract-test.mjs
      - run: npm run test:learn:preview
      - run: npm run test:blog:preview
      - run: npm run test:preview:lifecycle
      - run: npm run test:browser:ci
      - run: npm run test:feed:worker
      - run: npm run worker:migrate:local:repeat
      - run: npm run worker:dry-run
      - run: git diff --check
